[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "conversor"
version = "0.1.0"
description = "Conversor de sesiones entre DAWs (Ableton Live, Pro Tools, Logic, Cubase, FL Studio)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyaaf2>=1.7",
    "mido>=1.3",
    "PySide6>=6.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
conversor = "conversor.cli:main"

[project.gui-scripts]
conversor-gui = "conversor.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
conversor = ["templates/*.xml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
