[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "conversor"
version = "0.2.0"
description = "Conversor de sesiones entre DAWs (Ableton Live, Pro Tools, Logic, Cubase, FL Studio)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyaaf2>=1.7",
    "mido>=1.3",
    "PySide6>=6.6",
    "numpy>=1.24",
    "soundfile>=0.12",
    "soxr>=0.3",
    # Rubber Band, para estirar el audio con warp. No hay versión para Mac con Intel.
    "pylibrb>=0.1; python_version >= '3.12' and (sys_platform != 'darwin' or platform_machine != 'x86_64')",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
conversor = "conversor.cli:main"

[project.gui-scripts]
conversor-gui = "conversor.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
conversor = ["templates/*.xml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
