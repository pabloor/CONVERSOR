name: Aplicación para Mac

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # Mac con chip Apple (arm64).
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" "pyinstaller>=6.10"

      - name: Pruebas
        run: pytest -q

      - name: Construir Conversor.app y Conversor.dmg
        run: packaging/build_mac.sh

      - name: Autoprueba de la aplicación empaquetada
        env:
          QT_QPA_PLATFORM: offscreen
        run: dist/Conversor.app/Contents/MacOS/Conversor --autoprueba

      - uses: actions/upload-artifact@v4
        with:
          name: Conversor-mac
          path: dist/Conversor.dmg
          if-no-files-found: error
