name: Aplicación para Mac

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publicar:
        description: "Publicar un Release con la versión actual (crea la etiqueta vX.Y.Z)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    # Mac con chip Apple (arm64).
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" "pyinstaller>=6.10"

      - name: Pruebas
        run: pytest -q

      - name: Construir Conversor.app y Conversor.dmg
        run: packaging/build_mac.sh

      - name: Autoprueba de la aplicación empaquetada
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          dist/Conversor.app/Contents/MacOS/Conversor --autoprueba
          # La aplicación declara los tipos de archivo que abre (Dock, «Abrir con»).
          test "$(plutil -extract CFBundleDocumentTypes.0.CFBundleTypeExtensions.0 raw dist/Conversor.app/Contents/Info.plist)" = als

      - uses: actions/upload-artifact@v4
        with:
          name: Conversor-mac
          path: dist/Conversor.dmg
          if-no-files-found: error

      - name: Publicar la versión
        # Al subir una etiqueta v*, o al lanzar el flujo a mano con «publicar».
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python -c "import conversor; print(conversor.__version__)")
          tag="v$version"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "La etiqueta $GITHUB_REF_NAME no coincide con la versión $version" >&2
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "El Release $tag ya existe: sube la versión antes de publicar otro." >&2
            exit 1
          fi
          # Notas: la sección de esta versión en CHANGELOG.md.
          awk -v v="## $version" '$0 == v {on=1; next} /^## / {on=0} on' CHANGELOG.md > notas.md
          gh release create "$tag" dist/Conversor.dmg --target "$GITHUB_SHA" \
            --title "Conversor $version" --notes-file notas.md
